#Simplified Goose Agent
name: Goose Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  goose:
    # Run when: 1) issue labeled "goose", or 2) comment starts with "/goose"
    if: |
      (github.event.label.name == 'goose') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/goose'))
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Goose
        run: |
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh \
            | CONFIGURE=false GOOSE_BIN_DIR=/usr/local/bin bash
      
      - name: Configure Goose
        run: |
          mkdir -p ~/.config/goose
          cat <<EOF > ~/.config/goose/config.yaml
          GOOSE_PROVIDER: openai
          GOOSE_MODEL: ${{ secrets.OPENAI_MODEL }}
          keyring: false
          EOF
      
      - name: Get task from comment or issue
        id: task
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            # Extract task from /goose command
            TASK=$(echo "${{ github.event.comment.body }}" | sed 's/^\/goose //')
            ISSUE_NUM=${{ github.event.issue.number }}
          else
            # Use issue title and body
            TASK="${{ github.event.issue.title }}: ${{ github.event.issue.body }}"
            ISSUE_NUM=${{ github.event.issue.number }}
          fi
          
          echo "task<<EOF" >> $GITHUB_OUTPUT
          echo "$TASK" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT
      
      - name: Run Goose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_HOST: ${{ secrets.OPENAI_HOST }}
        run: |
          cat <<EOF > instructions.txt
          ${{ steps.task.outputs.task }}
          
          ENVIRONMENT CONTEXT:
          - You are in a GitHub Actions runner
          - Repository is already checked out at current directory
          - Repository: ${{ github.repository }}
          - Use file system tools to read and modify files
          - DO NOT try to clone repos or create PRs yourself
          - After you finish, GitHub Actions will commit your changes
          EOF
          
          goose run --instructions instructions.txt > output.txt 2>&1 || true
          
          # Clean up output
          sed -E 's/\x1B\[[0-9;]*[mK]//g' output.txt | \
            grep -v "logging to" | \
            grep -v "session" > clean_output.txt
      
      - name: Commit changes if any
        id: commit
        run: |
          git config user.name "goose-bot"
          git config user.email "goose-bot@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain) ]]; then
            BRANCH="goose-fix-${{ steps.task.outputs.issue_number }}-$(date +%s)"
            git checkout -b $BRANCH
            git add .
            git commit -m "fix: address issue #${{ steps.task.outputs.issue_number }}
            Automated fix by Goose Agent
            Triggered by: @${{ github.actor }}"
            git push origin $BRANCH
            
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create PR if changes exist
        if: steps.commit.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "fix: automated solution for issue #${{ steps.task.outputs.issue_number }}" \
            --body "🦆 **Goose Agent** attempted to fix issue #${{ steps.task.outputs.issue_number }}
          
          ## Changes Made
          $(cat clean_output.txt)
        
          ---
          Triggered by: @${{ github.actor }}" \
            --base main \
            --head ${{ steps.commit.outputs.branch }}
      
      - name: Comment on issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.commit.outputs.changes }}" == "true" ]; then
            COMMENT="✅ **Goose completed the task!**
          
          I've created a PR with my changes. Please review.
          
          <details>
          <summary>Output</summary>
          
          \`\`\`
          $(cat clean_output.txt)
          \`\`\`
          </details>"
                    else
                      COMMENT="ℹ️ **Goose analyzed the task**
          
          $(cat clean_output.txt)"
          fi
          
          gh issue comment ${{ steps.task.outputs.issue_number }} --body "$COMMENT"

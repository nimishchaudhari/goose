name: Goose Do It

on:
  issues:
    types:
      - labeled
      - opened
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - labeled
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_HOST: ${{ secrets.OPENAI_HOST }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
  OPENAI_BASE_PATH: v1/chat/completions
  GH_TOKEN: ${{ github.token }}

jobs:
  goose-resolve:
    name: Goose Resolver
    runs-on: ubuntu-latest
    
    if: |
      (github.event.label.name == 'goose') ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '@goose-ai')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@goose-ai') && !github.event.issue.pull_request)
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Goose CLI
        run: |
          mkdir -p /home/runner/.local/bin
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh \
            | CONFIGURE=false GOOSE_BIN_DIR=/home/runner/.local/bin bash
          echo "/home/runner/.local/bin" >> $GITHUB_PATH
      
      - name: Configure Goose
        run: |
          mkdir -p ~/.config/goose
          cat <<EOF > ~/.config/goose/config.yaml
          GOOSE_PROVIDER: openai
          GOOSE_MODEL: ${{ env.OPENAI_MODEL }}
          keyring: false
          EOF
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      
      - name: Prepare context for issues
        if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
        run: |
          {
            echo "# Issue: ${{ github.event.issue.title }}"
            echo ""
            echo "${{ github.event.issue.body }}"
            echo ""
            echo "[Link to issue](${{ github.event.issue.html_url }})"
          } > context.txt
      
      - name: Prepare context for PRs
        if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
        run: |
          {
            echo "# Pull Request: ${{ github.event.pull_request.title }}"
            echo ""
            echo "${{ github.event.pull_request.body }}"
            echo ""
            gh pr view ${{ github.event.pull_request.number }} --json files \
              -q '.files[] | "* " + .path + " (" + (.additions|tostring) + " additions, " + (.deletions|tostring) + " deletions)"'
            echo ""
            echo "## Changes Summary"
            gh pr diff ${{ github.event.pull_request.number }}"
            echo ""
            echo "[Link to PR](${{ github.event.pull_request.html_url }})"
          } > context.txt
      
      - name: Create instructions for Goose
        run: |
          TASK="${{ github.event.issue.title || github.event.pull_request.title }}"
          COMMENT_BODY="${{ github.event.comment.body || '' }}"
          
          cat <<EOF > instructions.txt
          You are a GitHub resolver assistant helping to fix issues or review pull requests.
          
          Task: $TASK
          
          Comment context (if any): $COMMENT_BODY
          
          Please analyze the provided context and:
          1. Understand the issue or PR requirement
          2. If it's a code issue, propose fixes or improvements
          3. If it's a question, provide a detailed answer
          4. Be concise but thorough
          5. Provide actionable suggestions
          
          Context:
          $(cat context.txt)
          EOF
      
      - name: Run Goose and filter output
        run: |
          goose run --instructions instructions.txt | \
            sed -E 's/\x1B\[[0-9;]*[mK]//g' | \
            grep -v "logging to /home/runner/.config/goose/sessions/" | \
            grep -v "^starting session" | \
            grep -v "^Closing session" | \
            sed 's/[[:space:]]*$//' \
            > goose_output.txt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_HOST: ${{ secrets.OPENAI_HOST }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_PATH: v1/chat/completions
      
      - name: Post comment to issue/PR
        if: github.event_name == 'issue_comment' || (github.event_name == 'issues' && github.event.action == 'labeled')
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body-file goose_output.txt \
            -R ${{ github.repository }}
      
      - name: Post comment to PR
        if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file goose_output.txt \
            -R ${{ github.repository }}
            

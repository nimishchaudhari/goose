name: Goose Do It

on:
  issues:
    types:
      - labeled
  issue_comment:
    types:
      - created

jobs:
  ask-goose:
    # This will run when an issue is labeled 'goose' OR if a comment in an issue (not PR) contains '@goose-ait'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    if: |
      github.event.label.name == 'goose' ||
      (github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '@goose-ai'))
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install goose-ai with pipx
        run: |
          pipx ensurepath --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          pipx install goose-ai
          pipx inject goose-ai langfuse==2.59.7
          which goose
          goose --version || true
        shell: bash
      
      - name: Run Goose Action
        uses: michaelneale/goose-fix-it-action@main
        with:
          task_request: |
            ${{ github.event.issue.title }}
            ${{ github.event.issue.body }}
            [Link to issue](${{ github.event.issue.html_url }})
          validation: "check the vite web app installs"          
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
